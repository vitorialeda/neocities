<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../style/style.css" />
        <link rel="stylesheet" href="../style/microblog.css" />
        <link rel="icon" type="image/png" href="../assets/favicon.png" />
        <title>Aaeri - Microblog</title>
    </head>
    <body class="microblog-body">
        <!--<h1 class="microblog-header">Microblog</h1>-->
        <img class="microblog-deco" src="" alt="" />
        <div class="microblog-page">
            <aside class="blog-sidebar">
                <div class="blog-card">
                    <img
                        class="blog-card-banner"
                        src="https://i.pinimg.com/1200x/b9/4f/4e/b94f4e51ceb033066e61e052199d08c4.jpg"
                        alt="banner"
                    />
                    <div class="blog-card-info">
                        <div class="blog-avatar-wrapper">
                            <img
                                src="https://i.pinimg.com/736x/a0/25/71/a02571f105a4b2b20368ebfc4b284cd7.jpg"
                                alt="avatar"
                            />
                        </div>
                        <h3 class="blog-title">Aaeri</h3>
                        <p class="blog-description">Vomitando palavras</p>
                    </div>
                </div>

                <a class="blog-back-link" href="../index.html">← Home</a>

                <div class="blog-tags-cloud">
                    <h4>Tags</h4>
                    <div class="tags-list"></div>
                </div>
            </aside>

            <main class="blog-feed"></main>
        </div>

        <script src="../script/microblog.js"></script>
    </body>
</html>
